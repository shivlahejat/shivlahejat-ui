name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Tests (runtime + CLI)
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Build docs (also builds the registry)
        run: npm run build
